<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Jogo para atenção</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            height: 100vh;
            background-image: url('https://t4.ftcdn.net/jpg/02/48/73/09/360_F_248730987_xRhUf0X7eMmK8cb1oo9gE64kpZrO1aSo.jpg'); 
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        .ui-panel {
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        h1, h2 { margin: 5px 0; text-shadow: 1px 1px 3px rgba(0,0,0,0.5); }

        #startBtn {
            padding: 12px 35px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 25px;
            background: #ff9f43;
            color: white;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            transition: 0.2s;
        }
        #startBtn:hover { background: #ffb167; transform: scale(1.05); }
        #startBtn:disabled { background: #57606f; cursor: not-allowed; transform: scale(1); }

        .arena {
            position: relative; 
            flex-grow: 1;
            margin: 20px;
            border: 4px solid #fff;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
        }

        .animal {
            position: absolute;
            width: 70px;
            height: 70px;
            font-size: 55px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.1s linear; 
        }
                
        .back-to-menu-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: #2e3440;
            color: #eceff4;
            border: 2px solid #4c566a;
            padding: 0.6rem 1.2rem;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 4px;
            z-index: 100;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .back-to-menu-btn:hover {
            background-color: #4c566a;
            border-color: #88c0d0;
            color: #88c0d0;
            box-shadow: 0 0 10px rgba(136, 192, 208, 0.3);
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-to-menu-btn">↩ Menu</a>
    
    <div class="ui-panel">
        <h1 id="levelText">Nível 1 (3 animais)</h1>
        <button id="startBtn">START (10 segundos)</button>
        <h2 id="result">Clique "START" e veja quem saltou mais alto!</h2>
    </div>
    
    <div class="arena" id="arena"></div>

    <script>
        const arena = document.getElementById('arena');
        const startBtn = document.getElementById('startBtn');
        const resultText = document.getElementById('result');
        const levelText = document.getElementById('levelText');

        const emojiPool = ['🦊', '🐰', '🐻', '🐼', '🐯', '🦁', '🐸'];
        
        let currentLevel = 1;
        let animalsData = []; 
        let isPlaying = false;
        
        let winnerId = ''; 
        let recordHeight = 0; 

        
        const gravity = 0.25; 
        const bounceFactor = -0.85; 

        function initLevel() {
            arena.innerHTML = ''; 
            animalsData = [];
            winnerId = '';
            recordHeight = 0;
            isPlaying = false;
            startBtn.disabled = false;

            let count = 3;
            if (currentLevel === 2) count = 5;
            if (currentLevel === 3) count = 7;

            levelText.innerText = `Nível ${currentLevel} (${count} animais)`;

            const arenaWidth = arena.clientWidth;
            const arenaHeight = arena.clientHeight;

            for (let i = 0; i < count; i++) {
                const div = document.createElement('div');
                div.className = 'animal';
                div.id = 'animal_' + i;
                div.innerText = emojiPool[i];

                const startX = (arenaWidth / (count + 1)) * (i + 1) - 35;
                const startY = arenaHeight - 75;

                div.style.left = startX + 'px';
                div.style.top = startY + 'px';
                arena.appendChild(div);

                animalsData.push({
                    element: div,
                    id: div.id,
                    emoji: emojiPool[i],
                    x: startX,
                    y: startY,
                    vx: 0, 
                    vy: 0, 
                    maxPeak: 0 
                });

                div.addEventListener('click', checkGuess);
            }
        }

        startBtn.addEventListener('click', () => {
            if (isPlaying) return;
            isPlaying = true;
            startBtn.disabled = true;
            resultText.innerText = "👀 Olha bem! Eles estão a voar!";

            const arenaHeight = arena.clientHeight;

            animalsData.forEach(animal => {
                animal.vx = (Math.random() * 12) - 6; 
                animal.vy = -(Math.random() * 15 + 10); 
                animal.maxPeak = 0;
            });

            function physicsLoop() {
                if (!isPlaying) return;

                const arenaWidth = arena.clientWidth;
                const arenaHeight = arena.clientHeight;

                animalsData.forEach(animal => {
                    animal.vy += gravity;

                    animal.x += animal.vx;
                    animal.y += animal.vy;

                    if (animal.y >= arenaHeight - 75) {
                        animal.y = arenaHeight - 75;
                        animal.vy *= bounceFactor; 
                        animal.vx += (Math.random() * 2) - 1; 
                    }

                    if (animal.y <= 0) {
                        animal.y = 0;
                        animal.vy *= -1; 
                    }

                    if (animal.x <= 0) {
                        animal.x = 0;
                        animal.vx *= -1; 
                    }
                    if (animal.x >= arenaWidth - 70) {
                        animal.x = arenaWidth - 70;
                        animal.vx *= -1; 
                    }

                    animal.element.style.left = animal.x + 'px';
                    animal.element.style.top = animal.y + 'px';

                    const currentHeightFromFloor = (arenaHeight - 75) - animal.y;
                    
                    if (currentHeightFromFloor > animal.maxPeak) {
                        animal.maxPeak = currentHeightFromFloor;
                    }

                    if (animal.maxPeak > recordHeight) {
                        recordHeight = animal.maxPeak;
                        winnerId = animal.id;
                    }
                });

                requestAnimationFrame(physicsLoop);
            }

            requestAnimationFrame(physicsLoop);

            setTimeout(() => {
                isPlaying = false; 
                startBtn.disabled = false;
                resultText.innerText = "🛑 STOP! O tempo acabou. Clica no animal que saltou mais alto durante esses 10 segundos.";
            }, 10000);
        });

        function checkGuess(event) {
            if (isPlaying || winnerId === '') return; 

            const clickedId = event.currentTarget.id;
            const winningAnimal = animalsData.find(a => a.id === winnerId);

            if (clickedId === winnerId) {
               
                localStorage.setItem(`game2_level${currentLevel}`, 'passed');

                if (currentLevel < 3) {
                    resultText.innerText = `🎉 CERTO! Isso é ${winningAnimal.emoji}! Passando para o nível seguinte ${currentLevel + 1}!`;
                    currentLevel++;
                    setTimeout(initLevel, 2500); 
                } else {
                    resultText.innerText = `🏆 Ganhaste! Completaste todos os 3 níveis! Tens incrível nível de atenção!`;
                    currentLevel = 1; 
                    setTimeout(initLevel, 4000);
                }
            } else {
                resultText.innerText = `❌ Falhaste! Mais alto do todos foi ${winningAnimal.emoji}. Tenta complentar esse nível novamente!`;
                setTimeout(initLevel, 3000); 
            }
        }

        window.onload = () => {
            initLevel();
        };
    </script>
</body>
</html>
